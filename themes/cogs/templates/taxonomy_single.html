{% extends "section.html" %}

{% block title %}
    {{ config.title }} - {{ term.name }}
{% endblock %}

{% block header %}
    {% set taxonomy_title = taxonomy.name | capitalize %}
    {{ <page.title title={taxonomy_title ~ ": " ~ term.name} /> }}
{% endblock %}

{% block content %}
    {{ <page.list pages={term.pages} date_format={config.extra.theme.date_format} /> }}
{% endblock %}
