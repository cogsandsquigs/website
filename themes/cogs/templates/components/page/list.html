
{% component page.list(pages, date_format=None) %}
<ul class="page-list">
    {% for page in pages | sort(attribute="date") | reverse %}
        <li>
            {{
                <page.title
                    title={page.title}
                    description={page.description}
                    url={page.path}
                    date={page.date}
                    taxonomies={page.taxonomies}
                    date_format={date_format}
                />
            }}
        </li>
    {% endfor %}
</ul>
{% endcomponent %}
