<!doctype html>
<html>
    <head>
        <!-- Preconnects for fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Fonts: PT Serif, Fira Code -->
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />

        <!--
            Modern-Normalize: Normalize browsers' default style(s)
            See: https://github.com/sindresorhus/modern-normalize
        --->
        <link
              href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.min.css"
              rel="stylesheet"
        />


        {% block head %}
            <!--
                The base stylesheet. Can be overridden to use other stylesheets e.g. page ones. If
                you want to use base style with a new stylesheet, import the base stylesheet in the
                (s)css!
            --->
            <link href="/base.css" rel="stylesheet"/>
        {% endblock %}
        
        <title>
            {% block title %}
                {{ config.title }}
            {% endblock %}
        </title>
    </head>

    <body>
        {% block body %}
        {% endblock %}
    </body>
</html>
